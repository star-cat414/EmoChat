[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emochat-backend"
version = "1.0.0"
description = "EmoChat FastAPI backend - N-Gram + HMM emotion intelligence"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "pydantic==2.13.4",
    "python-multipart==0.0.20",
    "numpy==2.5.2",
    "python-dotenv==1.1.1",
    "supabase==2.31.0",
    "openai==3.5.0",
    "scikit-learn==1.9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
